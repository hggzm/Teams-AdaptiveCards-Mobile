# proxy-only — do NOT cherry-pick this workflow to any clean/* branch
# or to any PR targeting microsoft/main. Lives only on:
#   hggz/AdaptiveCards-Mobile  : proxy/feat-swift-swiftpi-bridge, proxy/integration
#   hggzm/Teams-AdaptiveCards-Mobile : proxy/integration (after merge)
name: swift-swiftpi-bridge gate

on:
  push:
    branches:
      - 'proxy/feat-swift-swiftpi-bridge'
      - 'proxy/integration'
    paths:
      - 'source/ios-swift-swiftpi/**'
      - '.github/workflows/swift-swiftpi-bridge-gate.yml'
  pull_request:
    branches: [ 'proxy/integration' ]
    paths:
      - 'source/ios-swift-swiftpi/**'
      - '.github/workflows/swift-swiftpi-bridge-gate.yml'

jobs:
  windows-msvc:
    name: Windows MSVC / Swift 6.3.1
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      # The proxy/integration tree carries a tracked file with a colon
      # in its name ('t-Path C:\Users\hugogonzalez\teams_branch_diffs.txt'),
      # which is invalid on NTFS. `actions/checkout@v4` runs
      # `git checkout` which rejects the path with exit 128 regardless
      # of sparse-checkout settings. Workaround: do the clone manually
      # with `core.protectNTFS=false` so git on Windows ignores the
      # NTFS-safety check on that one path; everything else we care
      # about (source/ios-swift-swiftpi/ + the workflow) is safe.
      - name: Manual checkout with protectNTFS=false
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: |
          git config --global core.protectNTFS false
          git init .
          git remote add origin "https://github.com/$env:REPO.git"
          git -c protocol.version=2 fetch --no-tags --prune --no-recurse-submodules --depth=1 origin $env:REF
          git checkout --progress --force $env:REF
          git rev-parse HEAD
          # Debug: did Sources/ make it onto disk?
          Write-Host '--- ls source/ios-swift-swiftpi (top) ---'
          Get-ChildItem source/ios-swift-swiftpi | Format-Table -AutoSize | Out-String | Write-Host
          if (Test-Path source/ios-swift-swiftpi/Sources) {
            Write-Host '--- ls source/ios-swift-swiftpi/Sources ---'
            Get-ChildItem source/ios-swift-swiftpi/Sources -Recurse -File | Measure-Object | Format-Table -AutoSize | Out-String | Write-Host
          } else {
            Write-Host 'FATAL: Sources/ NOT on disk after checkout'
            Write-Host '--- ls-tree HEAD source/ios-swift-swiftpi (count) ---'
            (git ls-tree -r HEAD source/ios-swift-swiftpi | Measure-Object).Count
            exit 1
          }

      - name: Install Swift 6.3.1
        uses: compnerd/gha-setup-swift@main
        with:
          # compnerd/gha-setup-swift wants the release-branch name in
          # swift-version (NOT just the version number) and the
          # corresponding RELEASE tag in swift-build. This matches the
          # pattern used by hggz/swiftci and hggz/giteax CI.
          swift-version: "swift-6.3.1-release"
          swift-build:   "6.3.1-RELEASE"

      - name: swift --version
        run: swift --version

      # NIOHTTPCompression in the hggz/swift-nio-extras pin needs zlib
      # at C-module resolution time. Install via vcpkg manifest mode
      # using the vendored vcpkg.json under source/ios-swift-swiftpi/.
      - name: Install zlib (vcpkg manifest)
        working-directory: source/ios-swift-swiftpi
        run: |
          $env:VCPKG_DEFAULT_TRIPLET = 'x64-windows-static-md'
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install --triplet x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }
          $inc = (Resolve-Path "vcpkg_installed\x64-windows-static-md\include").Path
          $lib = (Resolve-Path "vcpkg_installed\x64-windows-static-md\lib").Path
          "ZLIB_INC=$inc"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "ZLIB_LIB=$lib"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "ZLIB_INC=$inc"
          Write-Host "ZLIB_LIB=$lib"

      # ----------------------------------------------------------------
      # Step 1 (compile floor): the vendored kit must build clean.
      # ----------------------------------------------------------------
      - name: swift build -c debug (kit)
        working-directory: source/ios-swift-swiftpi
        run: |
          swift build -c debug `
            -Xcc "-I$env:ZLIB_INC" `
            -Xswiftc "-I$env:ZLIB_INC" `
            -Xlinker "/LIBPATH:$env:ZLIB_LIB"
          if ($LASTEXITCODE -ne 0) { throw "kit build failed" }

      # ----------------------------------------------------------------
      # Step 2 (link + execute): the symbol-check demo must build,
      # run, and emit `PASS adaptivecards-swiftpi-agentloop`.
      # ----------------------------------------------------------------
      - name: smoke (build + run + assert PASS)
        working-directory: source/ios-swift-swiftpi/examples/adaptivecards-swiftpi-demo
        run: |
          ./smoke.ps1 -ZlibInc "$env:ZLIB_INC" -ZlibLib "$env:ZLIB_LIB"
          if ($LASTEXITCODE -ne 0) { throw "smoke failed" }
