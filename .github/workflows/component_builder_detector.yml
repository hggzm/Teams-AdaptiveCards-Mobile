name: Component Builder Detector

on:
  push:
    branches:
      - 'component-build-*'
    paths:
      - 'responses/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to check'
        required: false

jobs:
  detect-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.PAT }}

    - name: Extract Component Info from Branch
      id: extract
      run: |
        BRANCH_NAME="${{ github.ref_name }}"
        # Extract component-build-ComponentName-timestamp
        QUERY_ID=$(echo "$BRANCH_NAME" | sed 's/component-build-//')
        COMPONENT_NAME=$(echo "$QUERY_ID" | sed 's/-[0-9_]*$//')
        
        echo "query_id=$QUERY_ID" >> $GITHUB_OUTPUT
        echo "component_name=$COMPONENT_NAME" >> $GITHUB_OUTPUT
        echo "✅ Component: $COMPONENT_NAME, Query: $QUERY_ID"

    - name: Check for Response File
      id: check_response
      run: |
        QUERY_ID="${{ steps.extract.outputs.query_id }}"
        RESPONSE_FILE="responses/response_component_${QUERY_ID}.json"
        
        if [ -f "$RESPONSE_FILE" ]; then
          echo "response_exists=true" >> $GITHUB_OUTPUT
          echo "response_file=$RESPONSE_FILE" >> $GITHUB_OUTPUT
          echo "✅ Found response file: $RESPONSE_FILE"
          
          # Extract build status
          if command -v jq &> /dev/null; then
            STATUS=$(jq -r '.status // "unknown"' "$RESPONSE_FILE")
            BUILD_SUCCESS=$(jq -r '.response.compilation.success // false' "$RESPONSE_FILE")
            SUMMARY=$(jq -r '.response.summary // "Component build completed"' "$RESPONSE_FILE")
            
            echo "status=$STATUS" >> $GITHUB_OUTPUT
            echo "build_success=$BUILD_SUCCESS" >> $GITHUB_OUTPUT
            echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          fi
        else
          echo "response_exists=false" >> $GITHUB_OUTPUT
          echo "❌ No response file found yet"
          exit 0
        fi

      - name: Find PR Number
      if: steps.check_response.outputs.response_exists == 'true'
      id: find_pr
      run: |
        PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number')
        
        if [ -z "$PR_NUMBER" ]; then
          echo "❌ No PR found for branch ${{ github.ref_name }}"
          exit 1
        fi
        
        echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        echo "✅ Found PR #$PR_NUMBER"
      env:
        GH_TOKEN: ${{ secrets.PAT }}    - name: Update PR Labels
      if: steps.check_response.outputs.response_exists == 'true'
      run: |
        PR_NUMBER="${{ steps.find_pr.outputs.pr_number }}"
        BUILD_SUCCESS="${{ steps.check_response.outputs.build_success }}"
        
        # Remove awaiting-local-poller label
        gh pr edit "$PR_NUMBER" --remove-label "awaiting-local-poller" 2>/dev/null || true
        
        # Add build status labels
        if [ "$BUILD_SUCCESS" = "true" ]; then
          gh label create "build-complete" --color "28A745" --description "Component built successfully" --force 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "build-complete"
          
          gh label create "screenshots-pending" --color "FBCA04" --description "Waiting for screenshot test" --force 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "screenshots-pending"
        else
          gh label create "build-failed" --color "D73A4A" --description "Component build failed" --force 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "build-failed"
        fi
        
        echo "✅ Updated labels on PR #$PR_NUMBER"
      env:
        GH_TOKEN: ${{ secrets.PAT }}

    - name: Trigger Screenshot Test
      if: steps.check_response.outputs.response_exists == 'true' && steps.check_response.outputs.build_success == 'true'
      id: screenshot_test
      run: |
        COMPONENT_NAME="${{ steps.extract.outputs.component_name }}"
        
        echo "🎯 Triggering screenshot test for $COMPONENT_NAME..."
        
        # Trigger the magic file injection test workflow on this branch
        gh workflow run magic-file-injection-test.yml \
          --ref "${{ github.ref_name }}" \
          -f component_name="$COMPONENT_NAME"
        
        echo "screenshot_triggered=true" >> $GITHUB_OUTPUT
        
        echo "✅ Screenshot test triggered"
      env:
        GH_TOKEN: ${{ secrets.PAT }}    - name: Post Build Success Comment
      if: steps.check_response.outputs.response_exists == 'true' && steps.check_response.outputs.build_success == 'true'
      run: |
        PR_NUMBER="${{ steps.find_pr.outputs.pr_number }}"
        COMPONENT_NAME="${{ steps.extract.outputs.component_name }}"
        
        gh pr comment "$PR_NUMBER" --body "## ✅ Component Build Successful

**Component:** \`$COMPONENT_NAME\`

The component has been built successfully! 🎉

### 📦 Files Created
- ✅ \`${COMPONENT_NAME}Data.swift\` - Data model
- ✅ \`${COMPONENT_NAME}View.swift\` - SwiftUI view
- ✅ \`${COMPONENT_NAME}HostingView.swift\` - UIKit bridge
- ✅ \`${COMPONENT_NAME}ElementParser.swift\` - JSON parser
- ✅ \`CustomElementRegistry.swift\` - Updated registration

### 📸 Next Steps
- 🎯 Screenshot test has been triggered
- 📊 Visual validation pending
- 🔍 Review code and screenshots when available

Check the [Actions tab](${{ github.server_url }}/${{ github.repository }}/actions) for screenshot test progress."
        
        echo "✅ Posted build success comment"
      env:
        GH_TOKEN: ${{ secrets.PAT }}

    - name: Post Build Failure Comment
      if: steps.check_response.outputs.response_exists == 'true' && steps.check_response.outputs.build_success != 'true'
      run: |
        PR_NUMBER="${{ steps.find_pr.outputs.pr_number }}"
        COMPONENT_NAME="${{ steps.extract.outputs.component_name }}"
        
        # Extract error details from response
        ERRORS=$(jq -r '.response.compilation.errors[]? // empty' "${{ steps.check_response.outputs.response_file }}" | head -5)
        
        gh pr comment "$PR_NUMBER" --body "## ❌ Component Build Failed

**Component:** \`$COMPONENT_NAME\`

The component build encountered compilation errors.

### 🔍 Build Errors
\`\`\`
${ERRORS:-No detailed error information available}
\`\`\`

### 🔧 Next Steps
- Review the error messages above
- Check the response file: \`${{ steps.check_response.outputs.response_file }}\`
- Fix compilation issues
- Request a rebuild or update the code manually"
        
        echo "✅ Posted build failure comment"
      env:
        GH_TOKEN: ${{ secrets.PAT }}

    - name: Update PR Description
      if: steps.check_response.outputs.response_exists == 'true'
      run: |
        PR_NUMBER="${{ steps.find_pr.outputs.pr_number }}"
        COMPONENT_NAME="${{ steps.extract.outputs.component_name }}"
        BUILD_SUCCESS="${{ steps.check_response.outputs.build_success }}"
        
        if [ "$BUILD_SUCCESS" = "true" ]; then
          STATUS_EMOJI="✅"
          STATUS_TEXT="Build Successful"
          NEXT_STEPS="- 📸 Screenshot test in progress
- 🔍 Review generated code
- ✅ Merge when ready"
        else
          STATUS_EMOJI="❌"
          STATUS_TEXT="Build Failed"
          NEXT_STEPS="- 🔍 Review compilation errors
- 🔧 Fix issues
- 🔄 Request rebuild"
        fi
        
        cat > pr_body.md <<EOF
## 🤖 Component Build: $COMPONENT_NAME

**Status:** $STATUS_EMOJI $STATUS_TEXT

---

### 📋 Build Summary

${{ steps.check_response.outputs.summary }}

### 📦 Component Details

**Files:** 
- \`${COMPONENT_NAME}Data.swift\`
- \`${COMPONENT_NAME}View.swift\`
- \`${COMPONENT_NAME}HostingView.swift\`
- \`${COMPONENT_NAME}ElementParser.swift\`

### 📊 Next Steps

$NEXT_STEPS

---

*Response file: \`${{ steps.check_response.outputs.response_file }}\`*
EOF
        
        gh pr edit "$PR_NUMBER" --body-file pr_body.md
        
        echo "✅ Updated PR description"
      env:
        GH_TOKEN: ${{ secrets.PAT }}
