name: ios-demo-ipa-diag
# DIAGNOSTIC-BRANCH-ONLY (fork): runs the packageApp script from .pipelines/templates/ios-build-template.yml
# on a GitHub-hosted Mac, with the ADO macros substituted. Never merge.
on:
  push:
    branches: [ 'proxy/ios-demo-ipa-diag' ]
  workflow_dispatch:
jobs:
  archive:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Installing dependency via pod
        working-directory: source/ios/AdaptiveCards
        run: pod install
      - name: Run the template's packageApp script
        run: |
          ruby -ryaml -e '
            t = YAML.load_file(".pipelines/templates/ios-build-template.yml")
            s = t["steps"][1].find { |k, _| k.include?("packageApp") }[1][0]["script"]
            { "$(Build.SourcesDirectory)" => ENV["GITHUB_WORKSPACE"],
              "$(Agent.TempDirectory)" => ENV["RUNNER_TEMP"],
              "$" + "{{ parameters.configuration }}" => "Release" }.each { |a, b| s = s.gsub(a, b) }
            File.write(File.join(ENV["RUNNER_TEMP"], "package.sh"), s)
            puts s'
          APPLE_PROV_PROFILE_UUID=none-in-diag bash "$RUNNER_TEMP/package.sh"
      - name: Upload archive Info.plist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archive-info
          path: output/ADCIOSVisualizer.xcarchive/Info.plist
          if-no-files-found: warn
