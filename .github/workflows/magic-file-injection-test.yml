name: Magic File Injection Test

on:
  workflow_dispatch:
    inputs:
      magic_file_json:
        description: 'Custom Adaptive Card JSON to inject and test (leave empty for default test card)'
        required: false
        default: ''
      component_name:
        description: 'Component name to test (will use samples/{component_name_lowercase}-test.json)'
        required: false
        default: ''
      pr_number:
        description: 'PR number to post results to'
        required: false
        default: ''

jobs:
  magic-file-test:
    name: Run Magic File Injection Test
    runs-on: macos-14
    permissions:
      contents: read
      pull-requests: write
    
    timeout-minutes: 30
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Show Environment Info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🔧 Environment Information"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "macOS Version:"
          sw_vers
          echo ""
          echo "Xcode Version:"
          xcodebuild -version
          echo ""
          echo "Available Simulators:"
          xcrun simctl list devices available | grep "iPhone"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      
      - name: Install CocoaPods Dependencies
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📦 Installing CocoaPods Dependencies"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          cd source/ios/AdaptiveCards
          pod install --verbose
          echo "✅ CocoaPods dependencies installed"

      - name: Inject Custom Magic File JSON
        if: github.event.inputs.magic_file_json != ''
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🎯 Injecting Custom Adaptive Card JSON"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Backup original file
          cp samples/v1.3/Tests/MagicFileInjectionTest.json samples/v1.3/Tests/MagicFileInjectionTest.json.backup
          
          # Write custom JSON to magic file using printf to handle the input properly
          printf '%s\n' '${{ github.event.inputs.magic_file_json }}' > samples/v1.3/Tests/MagicFileInjectionTest.json
          
          echo "✅ Custom JSON injected into MagicFileInjectionTest.json"
          echo ""
          echo "File size: $(wc -c < samples/v1.3/Tests/MagicFileInjectionTest.json) bytes"
          echo ""
          echo "Preview (first 20 lines):"
          head -n 20 samples/v1.3/Tests/MagicFileInjectionTest.json
          echo ""
          echo "Validating JSON syntax..."
          if python3 -m json.tool samples/v1.3/Tests/MagicFileInjectionTest.json > /dev/null 2>&1; then
            echo "✅ JSON is valid"
          else
            echo "⚠️ JSON validation failed - continuing anyway"
          fi
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Inject Component Test JSON
        if: github.event.inputs.magic_file_json == '' && github.event.inputs.component_name != ''
        id: inject_component
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🎯 Injecting Component Test JSON"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          COMPONENT_NAME="${{ github.event.inputs.component_name }}"
          COMPONENT_NAME_LOWER=$(echo "$COMPONENT_NAME" | tr '[:upper:]' '[:lower:]')
          TEST_JSON="samples/${COMPONENT_NAME_LOWER}-test.json"
          
          echo "Component: $COMPONENT_NAME"
          echo "Test JSON path: $TEST_JSON"
          
          if [ ! -f "$TEST_JSON" ]; then
            echo "⚠️ Test JSON not found: $TEST_JSON"
            echo "Using default test card instead"
            echo "component_json_found=false" >> $GITHUB_OUTPUT
          else
            echo "✅ Found component test JSON: $TEST_JSON"
            
            # Backup original file
            cp samples/v1.3/Tests/MagicFileInjectionTest.json samples/v1.3/Tests/MagicFileInjectionTest.json.backup
            
            # Copy component test JSON to magic file location
            cp "$TEST_JSON" samples/v1.3/Tests/MagicFileInjectionTest.json
            
            echo "✅ Injected $TEST_JSON into MagicFileInjectionTest.json"
            echo "component_json_found=true" >> $GITHUB_OUTPUT
            echo "test_json_path=$TEST_JSON" >> $GITHUB_OUTPUT
            
            echo ""
            echo "File size: $(wc -c < samples/v1.3/Tests/MagicFileInjectionTest.json) bytes"
            echo ""
            echo "Preview (first 20 lines):"
            head -n 20 samples/v1.3/Tests/MagicFileInjectionTest.json
          fi
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Show Test Card Info
        if: github.event.inputs.magic_file_json == '' && github.event.inputs.component_name == ''
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📄 Using Default Test Card"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Default card content:"
          cat samples/v1.3/Tests/MagicFileInjectionTest.json
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Setup Simulator
        id: simulator
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🚀 Booting iPhone 16 simulator..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Find iPhone 16 simulator
          SIMULATOR_ID=$(xcrun simctl list devices | grep "iPhone 16 (" | grep -v "Pro" | grep -v "Plus" | head -1 | grep -oE '\([A-F0-9\-]+\)' | tr -d '()')
          
          if [ -z "$SIMULATOR_ID" ]; then
            echo "❌ iPhone 16 simulator not found"
            exit 1
          fi
          
          echo "Using simulator: $SIMULATOR_ID"
          
          # Boot the simulator
          xcrun simctl boot "$SIMULATOR_ID" || true
          
          # Wait for simulator to be ready
          echo "Waiting for simulator to fully boot..."
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          
          echo "✅ Simulator ready"
      
      - name: Run Magic File Injection Test
        id: magic-test
        continue-on-error: true
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🎯 Running Magic File Injection Test"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Make script executable
          chmod +x ./scripts/test-utils/run_adaptive_cards_tests_with_screenshots.sh
          
          # Run only the magic file injection test
          bash ./scripts/test-utils/run_adaptive_cards_tests_with_screenshots.sh visualizer testMagicFileInjection
        timeout-minutes: 20
        env:
          FASTLANE_SKIP_UPDATE_CHECK: true
          FASTLANE_DISABLE_COLORS: true
      
      - name: Restore Original Magic File
        if: always()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🔄 Restoring Original Magic File"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -f samples/v1.3/Tests/MagicFileInjectionTest.json.backup ]; then
            mv samples/v1.3/Tests/MagicFileInjectionTest.json.backup samples/v1.3/Tests/MagicFileInjectionTest.json
            echo "✅ Restored original MagicFileInjectionTest.json"
          fi

      - name: Collect Test Results
        if: always()
        id: test-results
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  📊 Collecting Test Results"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Find latest screenshot directory
          LATEST_DIR=$(ls -td screenshots/*/ 2>/dev/null | head -1)
          
          if [ -z "$LATEST_DIR" ]; then
            echo "⚠️ No screenshot directory found"
            echo "test_status=unknown" >> $GITHUB_OUTPUT
            echo "screenshot_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Screenshot directory: $LATEST_DIR"
          
          # Count screenshots
          XCTEST_COUNT=$(ls "$LATEST_DIR"visualizer/xctest_*.png 2>/dev/null | wc -l | xargs)
          AUTO_COUNT=$(ls "$LATEST_DIR"visualizer/auto_*.png 2>/dev/null | wc -l | xargs)
          TOTAL_COUNT=$((XCTEST_COUNT + AUTO_COUNT))
          
          echo "XCTest screenshots: $XCTEST_COUNT"
          echo "Auto screenshots: $AUTO_COUNT"
          echo "Total screenshots: $TOTAL_COUNT"
          
          # Determine test status
          if [ "${{ steps.magic-test.outcome }}" == "success" ]; then
            TEST_STATUS="✅ Passed"
            echo "test_status=passed" >> $GITHUB_OUTPUT
          else
            TEST_STATUS="❌ Failed"
            echo "test_status=failed" >> $GITHUB_OUTPUT
          fi
          
          echo "screenshot_count=$TOTAL_COUNT" >> $GITHUB_OUTPUT
          echo "xctest_count=$XCTEST_COUNT" >> $GITHUB_OUTPUT
          echo "auto_count=$AUTO_COUNT" >> $GITHUB_OUTPUT
          
          # Create summary
          echo "## 🎯 Magic File Injection Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** $TEST_STATUS" >> $GITHUB_STEP_SUMMARY
          # Check if custom JSON was provided (safer check)
          if [ -f samples/v1.3/Tests/MagicFileInjectionTest.json.backup ]; then
            echo "**Card Source:** 🎯 Custom JSON injected via workflow input" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Card Source:** 📄 Default test card" >> $GITHUB_STEP_SUMMARY
          fi
          echo "**Total Screenshots:** $TOTAL_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "  - XCTest Screenshots: $XCTEST_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "  - Auto Screenshots: $AUTO_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📸 What Was Captured" >> $GITHUB_STEP_SUMMARY
          echo "- Initial card load (after 1.0s render time)" >> $GITHUB_STEP_SUMMARY
          echo "- Card after scrolling down (after 0.5s)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download artifacts below to view the screenshots" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-file-screenshots-${{ github.run_number }}
          path: |
            screenshots/**/visualizer/*.png
            !screenshots/**/TestResults.xcresult/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
      
      - name: Upload Test Results Bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-file-test-results-${{ github.run_number }}
          path: screenshots/**/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Post Screenshot Results to PR
        if: always() && github.event.inputs.pr_number != ''
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  💬 Posting Screenshot Results to PR"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          PR_NUMBER="${{ github.event.inputs.pr_number }}"
          TEST_STATUS="${{ steps.test-results.outputs.test_status }}"
          SCREENSHOT_COUNT="${{ steps.test-results.outputs.screenshot_count }}"
          XCTEST_COUNT="${{ steps.test-results.outputs.xctest_count }}"
          AUTO_COUNT="${{ steps.test-results.outputs.auto_count }}"
          COMPONENT_NAME="${{ github.event.inputs.component_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Determine status emoji and text
          if [ "$TEST_STATUS" = "passed" ]; then
            STATUS_EMOJI="✅"
            STATUS_TEXT="Passed"
          elif [ "$TEST_STATUS" = "failed" ]; then
            STATUS_EMOJI="❌"
            STATUS_TEXT="Failed"
          else
            STATUS_EMOJI="⚠️"
            STATUS_TEXT="Unknown"
          fi
          
          # Determine card source
          if [ -n "$COMPONENT_NAME" ]; then
            CARD_SOURCE="🎯 Component test card: \`samples/$(echo $COMPONENT_NAME | tr '[:upper:]' '[:lower:]')-test.json\`"
          elif [ "${{ github.event.inputs.magic_file_json }}" != "" ]; then
            CARD_SOURCE="🎯 Custom JSON via workflow input"
          else
            CARD_SOURCE="📄 Default test card"
          fi
          
          # Create PR comment
          cat > comment.md <<EOF
        ## 📸 Screenshot Test Results
        
        **Component:** \`${COMPONENT_NAME:-Default}\`  
        **Status:** $STATUS_EMOJI $STATUS_TEXT  
        **Card Source:** $CARD_SOURCE
        
        ### 📊 Test Statistics
        - **Total Screenshots:** $SCREENSHOT_COUNT
        - **XCTest Screenshots:** $XCTEST_COUNT
        - **Auto Screenshots:** $AUTO_COUNT
        
        ### 📎 Artifacts
        - 📷 [Download Screenshots](${RUN_URL}#artifacts)
        - 📦 [View Test Results Bundle](${RUN_URL}#artifacts)
        
        ### 🔍 What Was Tested
        - Initial card load (after 1.0s render time)
        - Card after scrolling down (after 0.5s)
        
        ---
        
        [View Full Test Run]($RUN_URL)
        EOF
          
          gh pr comment "$PR_NUMBER" --body-file comment.md
          
          echo "✅ Posted screenshot results to PR #$PR_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
